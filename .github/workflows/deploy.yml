name: Deploy a producción

# Cada push a main: comprobación de tipos y despliegue al VPS.
# El despliegue ejecuta /apps/planetaketo/deploy.sh en el servidor (build atómico
# sin cortes). La llave SSH está restringida en el servidor a ese único comando.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llega otro push, espera su turno.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  typecheck:
    name: Comprobar tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  deploy:
    name: Desplegar al VPS
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ejecutar deploy.sh en el servidor
        # Dos intentos: el build descarga tipografías de Google y puede fallar por un corte de red puntual.
        # El cambio de build es atómico, así que un intento fallido no afecta a la web en vivo.
        run: |
          for intento in 1 2; do
            if ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"; then
              exit 0
            fi
            echo "Intento $intento fallido"; sleep 20
          done
          exit 1
